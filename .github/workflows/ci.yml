name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Lint
        run: |
          pip install ruff
          ruff check src tests
      - name: CPU test suite
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Inspect the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for required in ("cutedsl_decode/py.typed",
                           "cutedsl_decode/_vendor/LICENSE"):
              assert required in names, f"{required} missing from the wheel"
          assert any(n.endswith("LICENSE") for n in names), "LICENSE missing"
          assert any(n.endswith("NOTICE") for n in names), "NOTICE missing"
          print(f"{len(names)} files, licenses present")
          EOF
