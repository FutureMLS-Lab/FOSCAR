name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  provenance:
    # The shipped source must not carry the private research record: no dates,
    # commit hashes, review names, hostnames, absolute paths, or history.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No private provenance in the package
        run: |
          set -e
          fail=0
          # The vendored trees keep their upstream comments, so they are excluded.
          check() { if git grep -nE "$1" -- src/ ':!src/fosca/_vendor'; then
                      echo "FAILED: $2"; fail=1; fi }
          check '20[0-9]{2}-[0-9]{2}-[0-9]{2}'        "a date"
          check '\b(codex|owner decision|CLAUDE\.md)' "a review or agent reference"
          check 'the paper repository|the paper repo' "a paper reference"
          check '/Users/|/home/|/scratch/'            "an absolute path"
          check 'research-secure|ssr-b200'            "a hostname"
          check '\bgit show [0-9a-f]{7}'              "a git-show pointer"
          check 'docs/(kernel|superpowers)/'          "an internal docs path"
          check 'baselines/|profile/|data/measured'   "an internal tree"
          exit $fail

  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # A CPU build of torch first. The default wheel plus its nvidia-* siblings
          # is several GB, which exhausted the runner's disk and failed this job
          # during the install, before lint or a single test ran.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Lint
        run: |
          pip install "ruff==0.17.3"
          ruff check src tests
      - name: CPU test suite
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Inspect the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          # The wheel must carry the PEP 561 marker and the vendored tree's
          # README; the BSD-3 text those files are covered by lives in NOTICE,
          # which is shipped under dist-info/licenses.
          for required in ("fosca/py.typed",
                           "fosca/_vendor/README.md"):
              assert required in names, f"{required} missing from the wheel"
          assert any(n.endswith("LICENSE") for n in names), "LICENSE missing"
          assert any(n.endswith("NOTICE") for n in names), "NOTICE missing"
          print(f"{len(names)} files, licenses present")
          EOF
